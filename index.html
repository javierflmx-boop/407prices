<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>407 Renovations · Price Book</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:#F5C01A}
body{background:linear-gradient(180deg,#F5C01A 0%,#E8A020 40%,#7A4208 100%);font-family:'Inter',sans-serif;min-height:100vh;background-attachment:fixed}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 120px}
.hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.hdr-title{font-family:'Inter',sans-serif;font-weight:300;font-size:13px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,0.85)}
.edit-toggle{padding:7px 16px;border-radius:20px;border:1px solid rgba(255,255,255,0.4);background:transparent;font-family:'Inter',sans-serif;font-weight:500;font-size:11px;letter-spacing:.08em;color:#fff;cursor:pointer;transition:all .2s}
.edit-toggle.active{background:#fff;color:#0F0E0C}
.card{background:#0F0E0C;border-radius:4px;margin-bottom:2px;overflow:hidden}
.card-head{display:flex;justify-content:space-between;align-items:center;padding:20px 20px;cursor:pointer;user-select:none}
.card-left{display:flex;align-items:baseline;gap:14px}
.card-num{font-family:'Playfair Display',serif;font-weight:400;font-size:12px;color:#3A3733;min-width:18px}
.card-name{font-family:'Inter',sans-serif;font-weight:500;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#F7F6F3}
.card-right{display:flex;align-items:center;gap:10px}
.card-min{font-family:'Inter',sans-serif;font-weight:400;font-size:11px;color:#6A6460}
.card-arrow{font-size:10px;color:#5C5650;transition:transform .3s;display:inline-block}
.card.open .card-arrow{transform:rotate(180deg)}
.card-body{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1)}
.card.open .card-body{max-height:3000px}
.card-inner{padding:0 20px 20px}
.line{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #1E1C1A;gap:8px}
.line:last-child{border-bottom:none}
.line-label{font-family:'Inter',sans-serif;font-weight:300;font-size:13px;color:#8A8480;flex:1}
.line-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
.line-price{font-family:'Inter',sans-serif;font-weight:500;font-size:13px;color:#F7F6F3;white-space:nowrap}
.price-field{background:#1A1814;border:1px solid #C8A96E;border-radius:4px;padding:5px 8px;font-family:'Inter',sans-serif;font-weight:500;font-size:13px;color:#F7F6F3;width:85px;outline:none;text-align:right}
.add-btn{width:24px;height:24px;border-radius:50%;border:1px solid #2E2C2A;background:transparent;color:#5C5650;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;line-height:1;padding:0}
.add-btn.added{background:#C8A96E;border-color:#C8A96E;color:#0F0E0C;font-size:11px;font-weight:600}
.hero-block{background:#1A1814;border-radius:10px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.hero-ghost{position:absolute;top:-20px;right:-6px;font-family:'Playfair Display',serif;font-weight:700;font-size:120px;line-height:1;color:rgba(255,255,255,0.04);user-select:none}
.hero-lbl{font-family:'Inter',sans-serif;font-weight:200;font-size:9px;letter-spacing:.25em;text-transform:uppercase;color:rgba(255,255,255,0.35);margin-bottom:6px}
.hero-row{display:flex;align-items:flex-start;justify-content:space-between}
.hero-dollar{font-family:'Playfair Display',serif;font-size:18px;color:#C8A96E;margin-top:5px}
.hero-num{font-family:'Playfair Display',serif;font-weight:700;font-size:52px;line-height:1;letter-spacing:-.02em;color:#fff}
.hero-sub{font-family:'Inter',sans-serif;font-weight:200;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:rgba(255,255,255,0.2);margin-top:8px}
.hero-addbtn{margin-top:6px;padding:7px 12px;border-radius:2px;border:1px solid rgba(255,255,255,0.2);background:transparent;color:rgba(255,255,255,0.7);font-family:'Inter',sans-serif;font-weight:500;font-size:10px;cursor:pointer;transition:all .2s;white-space:nowrap}
.hero-addbtn.added{background:#C8A96E;border-color:#C8A96E;color:#0F0E0C}
.disc-wrap{background:#161412;border-radius:6px;padding:10px 12px;margin-bottom:12px}
.disc-lbl{font-family:'Inter',sans-serif;font-weight:500;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#5C5650;margin-bottom:8px}
.disc-btns{display:flex;gap:6px;flex-wrap:wrap}
.disc-btn{padding:5px 10px;border-radius:20px;border:1px solid #2E2C2A;background:transparent;font-family:'Inter',sans-serif;font-weight:500;font-size:10px;color:#5C5650;cursor:pointer;transition:all .15s}
.disc-btn.on{background:#C8A96E;border-color:#C8A96E;color:#0F0E0C}
.disc-result{margin-top:8px;font-family:'Inter',sans-serif;font-size:11px;color:#C8A96E;font-weight:500}
.sect{font-family:'Inter',sans-serif;font-weight:500;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#3A3733;margin:12px 0 6px}
.incl-badge{font-family:'Inter',sans-serif;font-weight:500;font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#C8A96E;background:#1E1C1A;padding:2px 7px;border-radius:2px;white-space:nowrap}
.qty-modal{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,0.6)}
.qty-sheet{background:#0F0E0C;border-radius:16px 16px 0 0;padding:24px 20px 40px;width:100%;max-width:560px}
.qty-title{font-family:'Inter',sans-serif;font-weight:500;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#5C5650;margin-bottom:6px}
.qty-label{font-family:'Playfair Display',serif;font-size:20px;color:#F7F6F3;margin-bottom:20px;line-height:1.2}
.qty-row{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.qty-input{flex:1;background:#161412;border:1px solid #C8A96E;border-radius:4px;padding:14px 16px;font-family:'Playfair Display',serif;font-size:28px;color:#F7F6F3;outline:none;text-align:center}
.qty-unit{font-family:'Inter',sans-serif;font-weight:300;font-size:14px;color:#5C5650;white-space:nowrap}
.qty-total{font-family:'Inter',sans-serif;font-size:13px;color:#C8A96E;margin-bottom:20px;min-height:20px}
.qty-confirm{width:100%;padding:16px;background:#C8A96E;border:none;border-radius:4px;font-family:'Playfair Display',serif;font-weight:700;font-size:18px;color:#0F0E0C;cursor:pointer}
.qty-cancel{width:100%;padding:12px;background:transparent;border:none;font-family:'Inter',sans-serif;font-size:13px;color:#5C5650;cursor:pointer;margin-top:8px}
.flip-check-row{display:flex;align-items:center;justify-content:space-between;background:#161412;padding:12px 14px;border-radius:2px;margin-bottom:2px;cursor:pointer}
.flip-check-left{display:flex;align-items:center;gap:10px}
.flip-check-lbl{font-family:'Inter',sans-serif;font-size:13px;color:#8A8480}
.flip-check-price{font-family:'Inter',sans-serif;font-weight:500;font-size:13px;color:#F7F6F3}
.flip-result{background:#C8A96E;border-radius:4px;padding:18px;margin-top:12px;display:none}
.flip-result-lbl{font-family:'Inter',sans-serif;font-weight:500;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:rgba(0,0,0,0.5);margin-bottom:4px}
.flip-result-total{font-family:'Playfair Display',serif;font-weight:700;font-size:44px;color:#0F0E0C;line-height:1;letter-spacing:-.02em}
.flip-result-breakdown{font-family:'Inter',sans-serif;font-weight:300;font-size:11px;color:rgba(0,0,0,0.5);margin-top:6px}
.flip-base-row{padding:12px 0;border-bottom:1px solid #1E1C1A;margin-bottom:12px;display:none}
.flip-base-lbl{font-family:'Inter',sans-serif;font-weight:500;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#5C5650;margin-bottom:4px}
.flip-base-num{font-family:'Playfair Display',serif;font-weight:700;font-size:30px;color:#F7F6F3}
.flip-base-70{font-family:'Inter',sans-serif;font-size:10px;color:#3A3733;margin-top:4px}
.pct-row{margin-bottom:14px}
.pct-lbl-row{display:flex;justify-content:space-between;margin-bottom:6px}
.pct-lbl{font-family:'Inter',sans-serif;font-weight:500;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#5C5650}
.pct-val{font-family:'Inter',sans-serif;font-weight:600;font-size:12px;color:#C8A96E}
.pct-marks{display:flex;justify-content:space-between;margin-top:4px}
.pct-mark{font-family:'Inter',sans-serif;font-size:9px;color:#3A3733}
.pct-mark.mid{color:#C8A96E}
.sum-bar{position:fixed;bottom:0;left:0;right:0;background:#0F0E0C;border-top:1px solid #1E1C1A;box-shadow:0 -4px 20px rgba(0,0,0,0.3);z-index:100;display:none}
.sum-inner{max-width:560px;margin:0 auto;padding:12px 16px 18px}
.sum-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #1E1C1A}
.sum-lbl{font-family:'Inter',sans-serif;font-weight:500;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#5C5650}
.sum-total{font-family:'Playfair Display',serif;font-weight:700;font-size:24px;color:#F7F6F3}
.sum-clear{padding:5px 12px;border-radius:20px;border:1px solid #2E2C2A;background:transparent;font-family:'Inter',sans-serif;font-weight:500;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#5C5650;cursor:pointer}
.sum-items{max-height:120px;overflow-y:auto}
.sum-line{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid #1A1814}
.sum-line:last-child{border-bottom:none}
.sum-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-right:7px}
.sum-name{font-size:12px;color:#8A8480;flex:1;font-family:'Inter',sans-serif}
.sum-price{font-family:'Inter',sans-serif;font-weight:500;font-size:12px;color:#F7F6F3;margin-right:8px}
.sum-rm{background:none;border:none;cursor:pointer;color:#3A3733;font-size:14px;padding:0;line-height:1}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="hdr-title">407 Renovations — Prices</div>
    <button class="edit-toggle" id="editBtn" onclick="toggleEdit()">Edit Prices</button>
  </div>
  <div id="cards"></div>
</div>
<div class="qty-modal" id="qtyModal" style="display:none" onclick="if(event.target===this)closeQty()">
  <div class="qty-sheet">
    <div class="qty-title">Add to estimate</div>
    <div class="qty-label" id="qtyLabel"></div>
    <div class="qty-row">
      <input class="qty-input" id="qtyInput" type="number" min="1" placeholder="1" oninput="updateQtyTotal()"/>
      <span class="qty-unit" id="qtyUnit"></span>
    </div>
    <div class="qty-total" id="qtyTotal"></div>
    <button class="qty-confirm" onclick="confirmQty()">Add to Job</button>
    <button class="qty-cancel" onclick="closeQty()">Cancel</button>
  </div>
</div>
  <div class="sum-inner">
    <div class="sum-head">
      <div>
        <div class="sum-lbl">Job Estimate</div>
        <div class="sum-total" id="sumTotal">$0</div>
      </div>
      <button class="sum-clear" onclick="clearAll()">Clear all</button>
    </div>
    <div class="sum-items" id="sumItems"></div>
  </div>
</div>
<script>
const CARDS=[
  {id:"flip",color:"#C8A96E",title:"Flip Calculator",flipCalc:true},
  {id:"design",color:"#8E6BBF",title:"Interior Design",items:[
    {label:"On-site consultation (1–2 hrs)",price:200},
    {label:"Space planning & layout",price:350},
    {label:"Material & finish selection",price:250},
    {label:"Mood board & concept",price:200},
    {label:"Full design package",price:750},
    {label:"Project supervision (per visit)",price:150},
  ]},
  {id:"labor",color:"#C8A96E",title:"Labor Rates",items:[
    {label:"Simple bathroom — labor only",price:3500,qty:"bathrooms"},
    {label:"Hourly rate",price:100,qty:"hours"},
    {label:"Half day (4 hrs)",price:400,qty:"days"},
    {label:"Full day (8 hrs)",price:800,qty:"days"},
    {label:"2-day job",price:1600,qty:"jobs"},
    {label:"3-day job",price:2400,qty:"jobs"},
    {label:"Week (5 days)",price:4000,qty:"weeks"},
    {label:"Emergency / same-day",price:150,unit:"/ hr",qty:"hours"},
    {label:"Helper — hourly",price:45,qty:"hours"},
    {label:"Helper — half day (4 hrs)",price:180,qty:"days"},
    {label:"Helper — full day (8 hrs)",price:360,qty:"days"},
    {label:"Helper — week (5 days)",price:1800,qty:"weeks"},
  ]},
  {id:"bathroom",color:"#E07A30",title:"Bathroom",heroPrice:12000,
    included:["Custom design & layout","Demo & haul","Shower walls — 24\"×48\" tile","Floor tile","Drywall / cement board","Toilet supply & install","Vanity supply & install","Plumbing rough & finish","LED lights","Grout, seal & cleanup"],
    addons:[
      {label:"Second floor surcharge",price:2000},
      {label:"Custom vanity supply & install",price:1500},
      {label:"Premium toilet supply & install",price:500},
      {label:"LED mirror supply & install",price:300},
      {label:"Niche / shelf (any size)",price:120,unit:"/ lf"},
      {label:"Frameless glass shower door",price:1000},
      {label:"Freestanding tub install",price:1200},
      {label:"Heated floor (electric mat)",price:900},
      {label:"Double vanity upgrade",price:600},
      {label:"Premium tile upgrade 24×48",price:3.00,unit:"– $10.00 / sf"},
    ],items:[]},
  {id:"kitchen",color:"#F5A623",title:"Kitchen",heroPrice:15000,
    included:["20 cabinets supply & install","LED lights inside cabinets","Countertop fabrication & set","Backsplash tile","Plumbing rough & finish","Electrical — outlets & hood","Demo & haul"],
    addons:[
      {label:"Extra cabinet (above 20)",price:350,unit:"/ each"},
      {label:"Cabinet with glass door",price:180,unit:"/ each"},
      {label:"Soft-close upgrade",price:95,unit:"/ each"},
      {label:"Under-cabinet LED strip",price:300,unit:"/ section"},
    ],items:[]},
  {id:"tile",color:"#2E9E5B",title:"Tile Labor",items:[
    {label:'24"×24" tile install',price:3.00,unit:"/ sf"},
    {label:'32"×32" tile install',price:3.50,unit:"/ sf"},
    {label:'24"×48" tile install',price:4.25,unit:"/ sf"},
    {label:"Backsplash install (full kitchen)",price:950,qty:"kitchens"},
    {label:"1,000 sf — 24×24",price:3000},
    {label:"1,000 sf — 32×32",price:3500},
    {label:"1,000 sf — 24×48",price:4250},
  ]},
  {id:"flooring",color:"#9B59B6",title:"Flooring",items:[
    {label:"LVP install",price:2.50,unit:"/ sf"},
    {label:"Hardwood install",price:4.50,unit:"/ sf"},
    {label:"Laminate install",price:2.00,unit:"/ sf"},
    {label:"Subfloor repair",price:600,qty:"areas"},
    {label:"Baseboards",price:3.50,unit:"/ lf"},
    {label:"Demo old flooring",price:350,qty:"rooms"},
  ]},
  {id:"painting",color:"#2980B9",title:"Painting",items:[
    {label:"Interior room (avg)",price:350,qty:"rooms"},
    {label:"Full house interior (2,000 sf)",price:4500},
    {label:"Exterior — 1 floor, 1,500 sf (labor + mat.)",price:2200},
    {label:"Kitchen cabinets repaint (full set)",price:3500},
    {label:"Trim & doors",price:600,qty:"rooms"},
  ]},
  {id:"quick",color:"#16A085",title:"Quick Services",items:[
    {label:"RV spot — septic, 50 amp power, water & connections",price:7500},
    {label:"Septic tank install — labor only (1 day)",price:1500},
    {label:"Septic tank install — labor only (2 days)",price:2500},
    {label:"Septic tank install — labor + unit + installation",price:3200},
    {label:"TV wall mount install",price:220},
    {label:"TV wall mount + power relocation",price:320},
    {label:"Ceiling fan install",price:180},
    {label:"Toilet install / replace",price:250},
    {label:"Faucet install / replace",price:150},
    {label:"Shower head / fixture replace",price:180},
    {label:"Vanity install",price:350},
    {label:"Mirror install",price:120},
    {label:"Towel bar & accessories set",price:100},
    {label:"Light fixture install",price:150},
    {label:"Door install (interior)",price:250},
    {label:"Door handle / lock replace",price:95},
  ]},
  {id:"drywall",color:"#C0392B",title:"Drywall",items:[
    {label:"Patch & texture (per hole)",price:120,qty:"holes"},
    {label:"Full room drywall",price:900,qty:"rooms"},
    {label:"Popcorn removal + texture + paint",price:6.00,unit:"/ sf"},
  ]},
];

let summary=[],openCards={},discounts={},editMode=false;

// Load saved prices
let saved={};
try{saved=JSON.parse(localStorage.getItem("407pb")||"{}");}catch(e){}

function getP(key,def){return saved[key]!==undefined?saved[key]:def;}
function setP(key,val){saved[key]=val;try{localStorage.setItem("407pb",JSON.stringify(saved));}catch(e){}}

function fmt(n,unit){
  if(unit) return "$"+Number(n).toFixed(2)+" "+unit;
  return "$"+Math.round(n).toLocaleString();
}
function isAdded(id){return summary.some(s=>s.id===id);}
let qtyPending=null;

function openQty(id,label,price,color,unit){
  qtyPending={id,label,price,color,unit};
  document.getElementById("qtyLabel").textContent=label;
  document.getElementById("qtyUnit").textContent=unit;
  document.getElementById("qtyInput").value="";
  document.getElementById("qtyTotal").textContent="";
  document.getElementById("qtyModal").style.display="flex";
  setTimeout(()=>document.getElementById("qtyInput").focus(),100);
}
function closeQty(){
  document.getElementById("qtyModal").style.display="none";
  qtyPending=null;
}
function updateQtyTotal(){
  if(!qtyPending) return;
  const q=parseFloat(document.getElementById("qtyInput").value)||0;
  const total=q*qtyPending.price;
  document.getElementById("qtyTotal").textContent=q>0?"Total: $"+Math.round(total).toLocaleString():"";
}
function confirmQty(){
  if(!qtyPending) return;
  const q=parseFloat(document.getElementById("qtyInput").value)||1;
  const total=Math.round(q*qtyPending.price);
  const id=qtyPending.id+"-x"+q;
  const label=qtyPending.label+(q>1?" × "+q:"");
  summary=summary.filter(s=>s.id!==qtyPending.id&&!s.id.startsWith(qtyPending.id+"-x"));
  summary.push({id,label,price:total,color:qtyPending.color});
  closeQty();
  render();
}

function handleAdd(btn){
  const id=btn.dataset.id;
  const label=btn.dataset.label;
  const price=parseFloat(btn.dataset.price)||0;
  const color=btn.dataset.color;
  const qty=btn.dataset.qty;
  const unit=btn.dataset.unit;
  addItem(id,label,price,color,qty,unit);
}

function addItem(id,label,price,color,qty,unit){
  if(editMode) return;
  if(qty && qty.length>0){
    const existing=summary.find(s=>s.id===id||s.id.startsWith(id+"-x"));
    if(existing){summary=summary.filter(s=>s.id!==existing.id);render();return;}
    openQty(id,label,price,color,unit&&unit.length>0?unit:qty);
    return;
  }
  if(isAdded(id)) summary=summary.filter(s=>s.id!==id);
  else summary.push({id,label,price:parseFloat(price)||0,color});
  render();
}
function removeItem(id){
  summary=summary.filter(s=>s.id!==id&&!s.id.startsWith(id+"-x"));
  render();
}
function clearAll(){summary=[];render();}
function toggleCard(id){openCards[id]=!openCards[id];render();}
function setDiscount(cardId,d){discounts[cardId]=d;render();}
function toggleEdit(){
  editMode=!editMode;
  if(editMode){
    // open all cards so everything is visible to edit
    CARDS.forEach(c=>openCards[c.id]=true);
  } else {
    // save all input values
    document.querySelectorAll(".price-field").forEach(inp=>{
      const key=inp.dataset.key;
      const val=parseFloat(inp.value);
      if(!isNaN(val)&&val>0) setP(key,val);
    });
    // close all cards
    CARDS.forEach(c=>openCards[c.id]=false);
  }
  render();
}

function calcFlip(){
  const arv=parseFloat(document.getElementById("flip-arv")?.value)||0;
  const pctEl=document.getElementById("flip-pct");
  const pct=pctEl?parseInt(pctEl.value):25;
  const pctLbl=document.getElementById("flip-pct-lbl");
  if(pctLbl) pctLbl.textContent=pct+"%";
  const kitchen=document.getElementById("flip-kitchen")?.checked;
  const bath=document.getElementById("flip-bath")?.checked;
  const split=document.getElementById("flip-split")?.checked;
  const gut=document.getElementById("flip-gut")?.checked;
  const gutSf=parseFloat(document.getElementById("flip-gut-sf")?.value)||0;
  const gutPrice=gut&&gutSf>0?Math.round(gutSf*110):0;
  const gutRes=document.getElementById("flip-gut-result");
  if(gutRes){if(gut&&gutSf>0){gutRes.style.display="block";gutRes.textContent=gutSf.toLocaleString()+" sf × $110 = $"+gutPrice.toLocaleString();}else gutRes.style.display="none";}
  const baseRow=document.getElementById("flip-base-row");
  const result=document.getElementById("flip-result");
  if(arv===0){if(baseRow)baseRow.style.display="none";if(result)result.style.display="none";return;}
  const base=Math.round(arv*(pct/100));
  let addons=[];
  if(kitchen) addons.push({label:"Kitchen flip",price:15000});
  if(bath)    addons.push({label:"Bathroom flip",price:12000});
  if(split)   addons.push({label:"Unit split",price:9000});
  if(gut&&gutSf>0) addons.push({label:"Full gut "+gutSf.toLocaleString()+" sf",price:gutPrice});
  const total=base+addons.reduce((s,a)=>s+a.price,0);
  const maxBuy=Math.round(arv*0.70)-total;
  if(baseRow){baseRow.style.display="block";document.getElementById("flip-base-num").textContent="$"+base.toLocaleString();const r70=document.getElementById("flip-rule70");if(r70)r70.textContent="70% rule · investor max purchase: $"+maxBuy.toLocaleString();}
  if(result){result.style.display="block";document.getElementById("flip-total").textContent="$"+total.toLocaleString();const parts=["Base $"+base.toLocaleString(),...addons.map(a=>a.label+" +$"+a.price.toLocaleString())];document.getElementById("flip-breakdown").textContent=parts.join(" · ");}
}

function render(){
  const btn=document.getElementById("editBtn");
  if(btn){btn.textContent=editMode?"✓ Done":"Edit Prices";btn.className="edit-toggle"+(editMode?" active":"");}

  document.getElementById("cards").innerHTML=CARDS.map((card,idx)=>{
    const isOpen=!!openCards[card.id];
    const disc=discounts[card.id]||0;
    const finalPrice=(card.heroPrice||0)-disc;
    let body="";

    if(card.flipCalc){
      body=`<div class="card-inner">
        <input id="flip-arv" type="number" class="flip-input" placeholder="After Repair Value $" oninput="calcFlip()"/>
        <div class="pct-row">
          <div class="pct-lbl-row"><span class="pct-lbl">Job Complexity</span><span class="pct-val" id="flip-pct-lbl">25%</span></div>
          <input type="range" min="15" max="30" value="25" step="5" oninput="calcFlip()" style="width:100%;accent-color:#C8A96E"/>
          <div class="pct-marks"><span class="pct-mark">Cosmetic 15%</span><span class="pct-mark">Simple 20%</span><span class="pct-mark mid">Moderate 25%</span><span class="pct-mark">Complex 30%</span></div>
        </div>
        <div class="flip-base-row" id="flip-base-row">
          <div class="flip-base-lbl">Base Renovation Price</div>
          <div class="flip-base-num" id="flip-base-num">—</div>
          <div class="flip-base-70" id="flip-rule70"></div>
        </div>
        <div style="font-family:'Inter',sans-serif;font-weight:500;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#5C5650;margin-bottom:8px">Add to this flip</div>
        <div class="flip-check-row" onclick="document.getElementById('flip-kitchen').click()">
          <div class="flip-check-left"><input type="checkbox" id="flip-kitchen" onchange="calcFlip()" style="accent-color:#C8A96E;width:16px;height:16px"/><span class="flip-check-lbl">Flip a Kitchen</span></div>
          <span class="flip-check-price">+$15,000</span>
        </div>
        <div class="flip-check-row" onclick="document.getElementById('flip-bath').click()">
          <div class="flip-check-left"><input type="checkbox" id="flip-bath" onchange="calcFlip()" style="accent-color:#C8A96E;width:16px;height:16px"/><span class="flip-check-lbl">Flip a Bathroom</span></div>
          <span class="flip-check-price">+$12,000</span>
        </div>
        <div class="flip-check-row" onclick="document.getElementById('flip-split').click()">
          <div class="flip-check-left"><input type="checkbox" id="flip-split" onchange="calcFlip()" style="accent-color:#C8A96E;width:16px;height:16px"/><span class="flip-check-lbl">Unit Split / Extra Dwelling</span></div>
          <span class="flip-check-price">+$9,000</span>
        </div>
        <div style="background:#161412;padding:12px 14px;border-radius:2px;margin-top:2px">
          <div class="flip-check-row" style="background:transparent;padding:0 0 10px 0" onclick="document.getElementById('flip-gut').click()">
            <div class="flip-check-left"><input type="checkbox" id="flip-gut" onchange="calcFlip()" style="accent-color:#C8A96E;width:16px;height:16px"/><span class="flip-check-lbl">Full Gut — studs to finish</span></div>
            <span class="flip-check-price">$110 / sf</span>
          </div>
          <input id="flip-gut-sf" type="number" placeholder="sq ft" oninput="calcFlip()" style="background:#0F0E0C;border:1px solid #2E2C2A;border-radius:2px;padding:8px 12px;font-family:'Inter',sans-serif;font-size:14px;color:#F7F6F3;width:100%;outline:none"/>
          <div id="flip-gut-result" style="display:none;margin-top:6px;font-family:'Inter',sans-serif;font-size:12px;color:#C8A96E;font-weight:500"></div>
        </div>
        <button onclick="calcFlip()" style="width:100%;margin-top:12px;padding:16px;background:#C8A96E;border:none;border-radius:4px;font-family:'Playfair Display',serif;font-weight:700;font-size:18px;color:#0F0E0C;cursor:pointer;letter-spacing:-.01em;">Calculate</button>
        <div class="flip-result" id="flip-result">
          <div class="flip-result-lbl">Your Total Price</div>
          <div class="flip-result-total" id="flip-total">—</div>
          <div class="flip-result-breakdown" id="flip-breakdown"></div>
        </div>
      </div>`;

    } else if(card.heroPrice){
      const pk=card.id+"-pkg";
      const pa=isAdded(pk);
      body=`<div style="padding:0 20px 20px">
        <div class="hero-block">
          <div class="hero-ghost">${card.title[0]}</div>
          <div class="hero-lbl">${card.title} — Complete Package</div>
          <div class="hero-row">
            <div>
              <div style="display:flex;align-items:flex-start;gap:2px">
                <span class="hero-dollar">$</span>
                ${editMode
                  ? `<input class="price-field" data-key="${card.id}-hero" data-def="${card.heroPrice}" value="${getP(card.id+'-hero',card.heroPrice)}" type="number" style="font-family:'Playfair Display',serif;font-size:40px;width:160px;background:#1A1814;border:1px solid #C8A96E;border-radius:4px;padding:4px 8px;color:#fff;outline:none"/>`
                  : `<span class="hero-num">${getP(card.id+'-hero',card.heroPrice).toLocaleString()}</span>`
                }
              </div>
              <div class="hero-sub">Labor + materials · firm price</div>
            </div>
            <button class="hero-addbtn ${pa?"added":""}" onclick="addItem('${pk}','${card.title} — complete package',${getP(card.id+'-hero',card.heroPrice)},'${card.color}')">${pa?"✓ Added":"+ Add"}</button>
          </div>
        </div>
        <div class="sect">Included in package</div>
        ${card.included.map(it=>`<div class="line"><span class="line-label">${it}</span><span class="incl-badge">included</span></div>`).join("")}
        <div class="sect" style="margin-top:16px">Extras — added to total</div>
        ${card.addons.map((it,i)=>{
          const k=card.id+"-addon-"+i;
          const p=getP(k,it.price);
          const added=summary.some(s=>s.id===k||s.id.startsWith(k+'-x'));
        const qtyAttr=it.qty||'';const unitAttr=it.unit||it.qty||'';
        return`<div class="line"><span class="line-label">${it.label}</span><div class="line-right">${editMode?`<input class="price-field" data-key="${k}" data-def="${it.price}" value="${p}" type="number"/>`:`<span class="line-price">${fmt(p,it.unit)}</span>`}<button class="add-btn ${added?"added":""}" data-id="${k}" data-label="${it.label}" data-price="${p}" data-color="${card.color}" data-qty="${qtyAttr}" data-unit="${unitAttr}" onclick="handleAdd(this)">${added?"✓":"+"}</button></div></div>`;
        }).join("")}
        ${card.id==="bathroom"?`<div style="padding:12px 0 0;font-family:'Inter',sans-serif;font-weight:300;font-size:11px;color:#3A3733;border-top:1px solid #1E1C1A;margin-top:12px">Labor only starting at $3,500 · simple bathroom 5 days or less</div>`:""}
      </div>`;

    } else {
      body=`<div class="card-inner">${card.items.map((it,i)=>{
        const k=card.id+"-"+i;
        const p=getP(k,it.price);
        const added=summary.some(s=>s.id===k||s.id.startsWith(k+'-x'));
        const qtyAttr=it.qty||'';const unitAttr=it.unit||it.qty||'';
        return`<div class="line"><span class="line-label">${it.label}</span><div class="line-right">${editMode?`<input class="price-field" data-key="${k}" data-def="${it.price}" value="${p}" type="number"/>`:`<span class="line-price">${fmt(p,it.unit)}</span>`}<button class="add-btn ${added?"added":""}" data-id="${k}" data-label="${it.label}" data-price="${p}" data-color="${card.color}" data-qty="${qtyAttr}" data-unit="${unitAttr}" onclick="handleAdd(this)">${added?"✓":"+"}</button></div></div>`;
      }).join("")}</div>`;
    }

    return`<div class="card ${isOpen?"open":""}">
      <div class="card-head" onclick="toggleCard('${card.id}')">
        <div class="card-left"><span class="card-num">${String(idx+1).padStart(2,"0")}</span><span class="card-name">${card.title}</span></div>
        <div class="card-right">${card.heroPrice?`<span class="card-min">starting at $${getP(card.id+'-hero',card.heroPrice).toLocaleString()}</span>`:""}<span class="card-arrow">▾</span></div>
      </div>
      <div class="card-body">${body}</div>
    </div>`;
  }).join("");

  const bar=document.getElementById("sumBar");
  if(summary.length===0){bar.style.display="none";return;}
  bar.style.display="block";
  const total=summary.reduce((s,i)=>s+(i.price||0),0);
  document.getElementById("sumTotal").textContent="$"+Math.round(total).toLocaleString();
  document.getElementById("sumItems").innerHTML=summary.map(item=>`
    <div class="sum-line">
      <div style="display:flex;align-items:center;flex:1"><div class="sum-dot" style="background:${item.color}"></div><span class="sum-name">${item.label}</span></div>
      <span class="sum-price">$${Math.round(item.price).toLocaleString()}</span>
      <button class="sum-rm" onclick="removeItem('${item.id}')">×</button>
    </div>`).join("");
}

render();
</script>
</body>
</html>
